name: Saba Studio native release verification
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - '.github/workflows/saba-native-release.yml'
      - 'app/**'
      - 'gradle/**'
      - 'scripts/verify_release.sh'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
permissions:
  contents: read
jobs:
  native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android native toolchain
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y glslc
          test -f "$ANDROID_HOME/ndk/27.2.12479018/source.properties"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build Release with native libraries
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -Pdistribution=github --no-daemon --max-workers=2 --stacktrace
      - name: Verify exact native release APK
        run: |
          bash scripts/verify_release.sh app/build/outputs/apk/release/app-release.apk
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            grep -qx "lib/$abi/libharness_local.so" app/build/outputs/apk/release/native-libraries.txt
          done
      - name: Upload native release and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabaStudio-native-alpha-release-test-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.txt
            app/build/outputs/gpuRuntime/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saba-native-release-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  native-runtime-emulator:
    name: Release JNI smoke on emulator (not physical hardware)
    needs: native-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: SabaStudio-native-alpha-release-test-signed
          path: native-release
      - name: Fetch checksum-pinned small inference test model
        run: |
          curl -fsSL --max-time 60 https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -o /tmp/stories260K.gguf
          echo '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  /tmp/stories260K.gguf' | sha256sum -c -
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p native-runtime-evidence
            bash scripts/release-smoke/run.sh emulator-5554 native-release/apk/release/app-release.apk /tmp/stories260K.gguf > native-runtime-evidence/probe.log 2>&1
            bash scripts/emulator-release-smoke.sh native-release/apk/release/app-release.apk
      - name: Upload native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saba-native-runtime-emulator-evidence
          path: |
            native-runtime-evidence/
            delivery-emulator/
          if-no-files-found: warn
          retention-days: 14
