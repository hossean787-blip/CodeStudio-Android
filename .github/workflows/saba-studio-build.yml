              # Issue #8 item 11: reviewed secure provider endpoint validation.
              'app/src/main/java/com/androidharness/app/data/ProviderRepository.kt',
              'app/src/test/java/com/androidharness/app/llm/RotatingKeyProviderTest.kt',
              'app/src/main/java/com/androidharness/app/AgentService.kt',
              'app/src/main/java/com/androidharness/app/llm/OpenAiCompatProvider.kt',
              'app/src/main/java/com/androidharness/app/agent/RunManager.kt',
              # Issue #8 item 04: reviewed upstream attribution and branding.
