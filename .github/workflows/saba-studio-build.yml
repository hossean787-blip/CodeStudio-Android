name: Saba Studio Android APK build and verification

on:
  push:
    branches: [main, develop/codestudio-alpha, "feature/**", "feat/**", "fix/**", "codex/**", "integration/**"]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'scripts/verify_release.sh'
      - 'scripts/emulator-release-smoke.sh'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/saba-studio-build.yml'
      - '.github/workflows/saba-native-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    name: Audit source and build Saba Studio APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Saba Studio source
        uses: actions/checkout@v4
      - name: Check upstream source completeness and preserved license
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.2-release https://github.com/Sanuu7/AndroidHarness.git /tmp/androidharness-audit
          python3 - <<'PY'
