              # Issue #8 item 26: redact upstream credential echoes in fallback status messages.
              'app/src/main/java/com/androidharness/app/llm/FallbackProvider.kt',
              'app/src/test/java/com/androidharness/app/llm/FallbackProviderTest.kt',
