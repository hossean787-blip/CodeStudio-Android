      - name: Verify complete pinned Free Claude Code source tree
        shell: bash
        run: |
          set -euo pipefail
          # Source integrity check: compare the exact Git tree of all vendored files,
          # including executable bits, paths and binary content, to the pinned upstream commit.
          git clone --no-checkout --filter=blob:none https://github.com/Alishahryar1/free-claude-code.git /tmp/fcc-integrity
          git -C /tmp/fcc-integrity fetch --depth 1 origin 1c72f5fef14249936902aa7927348caec29939d6
          original="$(git -C /tmp/fcc-integrity rev-parse FETCH_HEAD^{tree})"
          imported="$(git rev-parse HEAD:third_party/free-claude-code)"
          echo "Upstream tree: $original"
          echo "Imported tree: $imported"
          test "$original" = "$imported"
          test "$original" = "7bfe09e414b1e7002e20fcb193488afe2d479e7a"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK platform 37
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # AGP may resolve compileSdk=37 by the bare android-37 target path.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Validate guarded Free Claude Code Android launcher
        shell: bash
        run: |
          set -euo pipefail
          launcher=app/src/main/assets/skills/free-claude-code/scripts/fcc-local.sh
          test -f "$launcher"
          sh -n "$launcher"
          set +e
          sh "$launcher" check . > /tmp/fcc-preflight.out 2>&1
          code=$?
          set -e
          # Hosted CI is not Python 3.14.10. The launcher must refuse unsupported runtimes.
          test "$code" -eq 4
          grep -q 'requires exactly 3.14.10' /tmp/fcc-preflight.out
          test -f app/src/main/assets/skills/free-claude-code/SKILL.md
      - name: Run full JVM regression suite
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest -Pdistribution=github --no-daemon
      - name: Compile every Android instrumentation test before building APKs
        run: ./gradlew :app:compileDebugAndroidTestKotlin -Pdistribution=github --no-daemon
      - name: Build Saba Studio debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -Pdistribution=github --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabaStudio-v0.1.0-alpha.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build non-debuggable alpha release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -Pdistribution=github --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify alpha release identity and signature
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_release.sh app/build/outputs/apk/release/app-release.apk
      - name: Upload installable alpha release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SabaStudio-v0.1.0-alpha.2-release-no-local-runtime-test-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saba-jvm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  emulator-persistence:
    needs: audit-and-build
    name: Android emulator persistence and integration (not a physical device)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the exact verified release APK
        uses: actions/download-artifact@v4
        with:
          name: SabaStudio-v0.1.0-alpha.2-release-no-local-runtime-test-signed
          path: verified-release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run workspace persistence and integrated sidebar navigation on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pdistribution=github '-Pandroid.testInstrumentationRunnerArguments.class=com.androidharness.app.workspace.ChatWorkspaceDeviceTest#assignmentsPersistAndLegacyChatsBindOnce,com.androidharness.app.workspace.ChatWorkspaceDeviceTest#concurrentRunsAndUndoStayInTheirAssignedFolders,com.androidharness.app.workspace.MultiWorkspaceDeviceTest#version15MigrationPreservesExistingChatAndModelSelection,com.androidharness.app.workspace.MultiWorkspaceDeviceTest#grantsSurviveReopeningAndProtectSecondaryProjectsFromDeletion,com.androidharness.app.ui.ProjectSidebarDeviceTest#projectTreeSearchActionsAndToolsMatchTheApprovedLayout,com.androidharness.app.data.InternalResumeDeviceTest,com.androidharness.app.SabaBrandDeviceTest,com.androidharness.app.ui.study.StudyAssistantDeviceTest,com.androidharness.app.ui.chat.components.StudioUiDeviceTest,com.androidharness.app.ui.library.SourceIndexDeviceTest,com.androidharness.app.ui.chat.ChatExperienceDeviceTest#chatHasQuietThoughtsNoRawResultsAndOnlyConditionalCodeHandoff,com.androidharness.app.llm.AnonymousFreeProviderDeviceTest,com.androidharness.app.SabaNotificationDeviceTest,com.androidharness.app.ui.chat.CacheUsageDisclosureDeviceTest#cacheTelemetryIsHiddenUntilExpandedAndCanBeClosedAgain,com.androidharness.app.plugins.AiRuntimeBridgeDeviceTest,com.androidharness.app.documents.DocumentExportDeviceTest,com.androidharness.app.documents.DocumentStudioStoreDeviceTest,com.androidharness.app.documents.DocumentStudioPickerDeviceTest,com.androidharness.app.ui.settings.LocalizationDeviceTest#persianHomeRendersRtlAtLargeTextAndKeepsActionsReadable,com.androidharness.app.ui.settings.LocalizationDeviceTest#persianSearchAndPermissionControlsWorkWithLargeText,com.androidharness.app.ui.settings.LocalizationDeviceTest#persianPrimaryScreensAndModelPickerPreserveModelIds' -Pandroid.testInstrumentationRunnerArguments.liveAnonymousFreeProvider=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace
            mkdir -p delivery-emulator
            adb pull /sdcard/Android/data/ir.sabagostar.sabastudio.debug/files/issue8 delivery-emulator/issue8-live
            # Validate the capture in a file: emulator-runner executes script lines individually.
            python3 scripts/verify-study-screenshot.py delivery-emulator/issue8-live/study-ui/study-fa-light-flashcards.png
            bash scripts/emulator-release-smoke.sh verified-release/app-release.apk
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saba-emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            delivery-emulator/
          if-no-files-found: warn
          retention-days: 14

  document-readers:
    needs: emulator-persistence
    name: Independently open native document exports
    # The independent LibreOffice check must run, not time out during apt mirror downloads.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: saba-emulator-test-reports
          path: native-evidence
      - name: Install independent readers (CI tools only)
        run: |
          python -m pip install python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 Pillow==11.3.0 pypdf==6.1.1
          sudo apt-get update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
          libreoffice --version
      - name: Open all formats and verify real Office conversions
        run: python scripts/validate_document_exports.py native-evidence --output document-reader-evidence --libreoffice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saba-document-independent-reader-evidence
          path: document-reader-evidence/
          if-no-files-found: warn
